description_paragraph1: "Workshops take place at Olive Tree Mansion, a luxury villa just 400 meters from Jadro Beach on the beautiful island of Vir. Surrounded by olive trees, it offers an outdoor pool and a rooftop terrace with a sea view for relaxing after workshops."
description_paragraph2: "Each apartment has a private bathroom, air conditioning, and access to a shared kitchen, dining area, and Wi-Fi. Located in a quiet part of Vir, the villa has everything you need for a pleasant stay – with Zadar Airport just 40 km away and easily accessible via the bridge."
description_paragraph3: "Along with comfortable accommodations, the workshop includes delicious and fresh breakfasts, lunches, dinners, and soft drinks."
eventLocation: "Olive Tree Mansion, Vir Island, Croatia"
