media:
  input: public/media
  output: /media

content:
  - name: general
    label: General Information
    type: file
    path: src/content/general/general.yaml
    fields:
      - name: editionNumber
        label: EditionNumber
        type: string
        required: true
      - name: editionYear
        label: EditionYear
        type: string
        required: true

  - name: hero
    label: Hero Section
    type: file
    path: src/content/hero/hero.yaml
    fields:
      - name: eventDate
        label: EventDate
        type: string
        required: true
      - name: eventLocation
        label: EventLocation
        type: string
        required: true

  - name: about
    label: About Section
    type: file
    path: src/content/about/about.yaml
    fields:
      - name: featureCards
        label: Feature Cards
        type: object
        list: true
        fields:
          - name: text
            label: Text
            type: text
            required: true
          - name: order
            label: Order
            type: number
      - name: polaroidGallery
        label: Polaroid Gallery
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            required: true
          - name: caption
            label: Caption
            type: string
            required: true
          - name: order
            label: Order
            type: number

  - name: venue
    label: Venue Information
    type: file
    path: src/content/venue/venue.yaml
    fields:
      - name: description_paragraph1
        label: Description Paragraph 1
        type: text
        required: true
      - name: description_paragraph2
        label: Description Paragraph 2
        type: text
        required: true
      - name: description_paragraph3
        label: Description Paragraph 3
        type: text
        required: true
      - name: eventLocation
        label: EventLocation
        type: string
        required: true
      - name: polaroidCardImages
        label: PolaroidCard Images
        type: image
        list: true
      - name: carouselImages
        label: Carousel Images
        type: image
        list: true

  - name: agenda
    label: Agenda
    type: file
    path: src/content/agenda/agenda.yaml
    fields:
      - name: startDay
        label: Start Day
        type: number
        required: true
        help: "1 = Monday, 2 = Tuesday, 3 = Wednesday, 4 = Thursday, 5 = Friday, 6 = Saturday, 7 = Sunday"
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true

  - name: team
    label: Team Members
    type: collection
    path: src/content/team
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: company
        label: Company
        type: string
      - name: bio
        label: Bio
        type: text
      - name: image
        label: Image
        type: image
        required: true
      - name: order
        label: Order
        type: number
      - name: social
        label: Social Links
        type: object
        fields:
          - name: twitter
            label: Twitter
            type: string
          - name: github
            label: GitHub
            type: string

  - name: previousEditions
    label: Previous Editions
    type: file
    path: src/content/previousEditions/previousEditions.yaml
    fields:
      - name: polaroidCardImages
        label: PolaroidCard Images
        type: image
        list: true
      - name: carouselImages
        label: Carousel Images
        type: image
        list: true

  - name: reservation
    label: Reservations
    type: file
    path: src/content/reservation/reservation.yaml
    fields:
      - name: dateOptions
        label: Date Options
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: label
            label: Label
            type: string
            required: true
          - name: available
            label: Available
            type: boolean
            required: true
      - name: rooms
        label: Rooms
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: descriptions
            label: Descriptions
            type: string
            list: true
            required: true
          - name: price
            label: Price
            type: number
          - name: people_count
            label: People Count
            type: number
      - name: dateRoomAvailability
        label: Date Room Availability
        type: object
        list: true
        fields:
          - name: dateId
            label: Date ID
            type: string
            required: true
          - name: availableRoomIds
            label: Available Room IDs
            type: string
            list: true

  - name: unforgettableExperience
    label: Unforgettable Experience
    type: file
    path: src/content/unforgettableExperience/unforgettableExperience.yaml
    fields:
      - name: backgroundVideo
        label: Background Video
        type: file
        categories: [video]

  - name: faq
    label: FAQ
    type: collection
    path: src/content/faq
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true
      - name: order
        label: Order
        type: number

  - name: contact
    label: Contact Information
    type: file
    path: src/content/contact/contact.yaml
    fields:
      - name: discordUrl
        label: Discord URL
        type: string
        required: true

  - name: settings
    label: Settings
    type: file
    path: src/content/settings/settings.yaml
    fields:
      - name: contactFormEmail
        label: Contact Form Email
        type: string
        required: true
      - name: reservationFormEmail
        label: Reservation Email
        type: string
        required: true
