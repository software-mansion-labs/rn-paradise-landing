media:
  - name: images
    label: Images
    input: public/images
    output: /images
    extensions: [png, webp]
  - name: videos
    label: Videos
    input: public/videos
    output: /videos
    categories: [video]

content:
  - name: general
    label: General Information
    type: collection
    path: src/content/general
    fields:
      - name: editionNumber
        label: EditionNumber
        type: string
        required: true
      - name: editionYear
        label: EditionYear
        type: string
        required: true
      - name: buyTicketUrl
        label: BuyTicketUrl
        type: string
        required: true

  - name: hero
    label: Hero Section
    type: collection
    path: src/content/hero
    fields:
      - name: eventDate
        label: EventDate
        type: string
        required: true
      - name: eventLocation
        label: EventLocation
        type: string
        required: true
      - name: eventLocation2
        label: EventLocation2
        type: string
        required: true
      - name: polaroidCardImages
        label: PolaroidCard Images
        type: image
        list: true
        required: true

  - name: team
    label: Team Members
    type: collection
    path: src/content/team
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: bio
        label: Bio
        type: text
      - name: image
        label: Image
        type: image
        required: true
      - name: social
        label: Social Links
        type: object
        fields:
          - name: twitter
            label: Twitter
            type: string
          - name: github
            label: GitHub
            type: string

  - name: venue
    label: Venue Information
    type: collection
    path: src/content/venue
    fields:
      - name: description
        label: Description
        type: text
        required: true
      - name: eventLocation
        label: EventLocation
        type: string
        required: true
      - name: polaroidCardImages
        label: PolaroidCard Images
        type: image
        list: true
        required: true
      - name: carouselImages
        label: Carousel Images
        type: image
        list: true
        required: true

  - name: tickets
    label: Ticket Information
    type: collection
    path: src/content/tickets
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: features
        label: Features
        type: string
        list: true
      - name: link
        label: Link
        type: string

  - name: faq
    label: FAQ
    type: collection
    path: src/content/faq
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: text
        required: true

  - name: previousEditions
    label: Previous Editions
    type: collection
    path: src/content/previousEditions
    fields:
      - name: polaroidCardImages
        label: PolaroidCard Images
        type: image
        list: true
        required: true
      - name: carouselImages
        label: Carousel Images
        type: image
        list: true
        required: true

  - name: unforgettableExperience
    label: Unforgettable Experience
    type: collection
    path: src/content/unforgettableExperience
    fields:
      - name: backgroundVideo
        label: Background Video
        type: file
        categories: [video]
        required: true
